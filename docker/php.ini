memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
; Plan edit screens submit thousands of ACF inputs (ADR-0003).
max_input_vars = 10000

; The image's defaults (4,000 files, 8 MB of strings) are too small for
; WordPress + WooCommerce + ACF: the strings buffer fills on the first page.
; Timestamps are still checked every 2 s, so theme edits show on reload.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
